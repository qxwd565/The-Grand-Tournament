name: Audit all 148 TGT card histories and koKR text
on:
  push:
    paths:
      - '.github/workflows/audit-tgt-148.yml'
      - 'tools/audit-tgt-148.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all TGT data, historical text and API transports
        run: |
          python3 tools/audit-tgt-148.py
          git diff --check
      - name: Commit machine-readable report and review table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/tgt-full-qa-20261114.json tools/tgt-full-qa-summary-20261114.md
          if ! git diff --cached --quiet; then
            git commit -m "Audit all TGT card snapshots and historical Korean strings [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
