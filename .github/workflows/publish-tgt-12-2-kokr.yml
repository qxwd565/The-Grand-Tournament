name: Publish audited 12.2 Korean text histories for 23 TGT cards
on:
  push:
    paths:
      - '.github/workflows/publish-tgt-12-2-kokr.yml'
      - 'tools/restore_tgt_122_kokr.py'
      - 'tools/test-tgt-12-2-kokr.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the 23 audited wording histories, retaining all existing gameplay changes
        run: |
          python3 tools/migrate-date-schema.py
          python3 tools/build-api.py
          python3 tools/test-tgt-12-2-kokr.py
          python3 tools/audit-tgt-148.py
          git diff --check
      - name: Commit canonical histories, generated endpoints and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data metadata cards.json cards-date.json render.json render-date.json history.json history-date.json
          git add -- tools/tgt-full-qa-20261114.json tools/tgt-full-qa-summary-20261114.md
          if ! git diff --cached --quiet; then
            git commit -m "Restore 23 audited TGT koKR launch descriptions and 12.2 revisions [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
